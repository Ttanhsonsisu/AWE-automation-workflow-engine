name: AWE Backend Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  OWNER_LC: ""

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 1. BUILD API GATEWAY ---
      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Presentation/AWE.ApiGateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-api-gateway:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. BUILD ENGINE WORKER ---
      - name: Build and push Engine Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Workers/AWE.Wokrer.Engine/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-engine-worker:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-engine-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3. BUILD PLUGIN WORKER ---
      - name: Build and push Plugin Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Workers/AWE.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-plugin-worker:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/awe-plugin-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
