<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWE Webhook Application Form Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #172033;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #dfe4ef;
      border-radius: 12px;
      box-shadow: 0 18px 54px rgba(24, 31, 50, 0.12);
      overflow: hidden;
    }

    header {
      padding: 24px 28px;
      border-bottom: 1px solid #e6eaf2;
      background: linear-gradient(135deg, #eef6ff, #fff);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    p {
      margin: 8px 0 0;
      color: #5c667a;
      font-size: 14px;
    }

    form {
      padding: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #39445a;
      letter-spacing: 0;
    }

    .wide {
      grid-column: 1 / -1;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccd4e2;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      background: #fff;
      color: #172033;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      padding: 11px 16px;
      cursor: pointer;
      justify-self: start;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    pre {
      grid-column: 1 / -1;
      margin: 0;
      min-height: 52px;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 8px;
      border: 1px solid #dfe4ef;
      background: #f8fafc;
      padding: 12px;
      color: #25324a;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      form {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AWE Webhook Application Form Demo</h1>
      <p>Paste the webhook URL copied from the Webhook Trigger node, then submit a sample application profile.</p>
    </header>

    <form id="applicationForm">
      <label class="wide">
        Webhook URL
        <input id="webhookUrl" name="webhookUrl" required placeholder="http://localhost:8080/api/webhooks/catch/demo/application-intake">
      </label>

      <label>
        Application ID
        <input name="applicationId" required>
      </label>

      <label>
        Applicant name
        <input name="applicantName" required value="Nguyen Van A">
      </label>

      <label>
        Email
        <input name="email" type="email" required value="nguyenvana@example.edu.vn">
      </label>

      <label>
        Major
        <input name="major" required value="Artificial Intelligence">
      </label>

      <label>
        GPA
        <input name="gpa" type="number" min="0" max="4" step="0.01" required value="3.45">
      </label>

      <label>
        English score
        <input name="englishScore" type="number" min="0" max="990" required value="720">
      </label>

      <label>
        Experience months
        <input name="experienceMonths" type="number" min="0" required value="8">
      </label>

      <label>
        Priority
        <select name="priority">
          <option value="urgent">urgent</option>
          <option value="normal">normal</option>
        </select>
      </label>

      <label class="wide">
        Note
        <textarea name="note">Demo payload from external form/web app.</textarea>
      </label>

      <button type="submit">Send application</button>
      <pre id="result">Ready.</pre>
    </form>
  </main>

  <script>
    const form = document.querySelector('#applicationForm');
    const result = document.querySelector('#result');
    const idInput = form.elements.applicationId;

    idInput.value = `HS-DEMO-${new Date().toISOString().replace(/\D/g, '').slice(8, 14)}`;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      result.textContent = 'Sending...';

      const data = new FormData(form);
      const webhookUrl = String(data.get('webhookUrl') || '').trim();
      const payload = {
        applicationId: String(data.get('applicationId') || ''),
        applicantName: String(data.get('applicantName') || ''),
        email: String(data.get('email') || ''),
        major: String(data.get('major') || ''),
        gpa: Number(data.get('gpa') || 0),
        englishScore: Number(data.get('englishScore') || 0),
        experienceMonths: Number(data.get('experienceMonths') || 0),
        priority: String(data.get('priority') || 'normal'),
        note: String(data.get('note') || '')
      };

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const text = await response.text();
        result.textContent = `HTTP ${response.status}\n${text || '(empty response)'}`;
      } catch (error) {
        result.textContent = error instanceof Error ? error.message : String(error);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
