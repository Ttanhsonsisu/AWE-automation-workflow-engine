name: awe-platform-dev

networks:
  awe-network:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data:
  minio-data:
  redis-data:

services:

  # cloudflare-tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: awe-cloudflare-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - awe-network

  #MINI IO
  minio:
    image: minio/minio:latest
    # container_name: awe-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_MANAGEMENT_PORT}:9001"
    volumes:
      - minio-data:/data 
    networks:
      - awe-network
  # DATABASE POSTGRESQL
  postgres:
      image: postgres:${POSTGRES_IMAGE_TAG}
      container_name: awe-postgres-dev
      restart: always
      ports:
        - "${POSTGRES_PORT}:5432"
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        # POSTGRES_DB: awe_db
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
      networks:
        - awe-network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d awe_db"]
        interval: 5s
        timeout: 5s
        retries: 10

  # ----------------------------------------
  # 3. KEYCLOAK (Identity & SSO)
  # ----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: awe-keycloak-dev
    command: start-dev --import-realm --metrics-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KC_PROXY: "edge"     
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak-init:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - awe-network

  # REDIS
  redis:
    image: redis:${REDIS_IMAGE_TAG}
    container_name: awe-redis-dev
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Backend F5 appsettings use this local-only password. The self-host stack
    # has its own Compose file and remains unaffected.
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD:-change_me}" --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - awe-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_DEV_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # REDIS INSIGHT (GUI)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: awe-redisinsight-dev
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    networks:
      - awe-network
    depends_on:
      redis:
        condition: service_healthy

  # RABBITMQ   
  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG}
    container_name: awe-rabbitmq-dev
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: /
 
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    networks:
      - awe-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  # SETUP WORKER 
  rabbitmq-setup:
    image: curlimages/curl
    container_name: awe-rabbitmq-setup-dev
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - awe-network
    environment:
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_HOST: rabbitmq
    command: |
      /bin/sh -c "
      echo 'Waiting for RabbitMQ Management API...'
      
      # Retry loop
      while ! curl -s -f -u $${RABBITMQ_USER}:$${RABBITMQ_PASS} http://$${RABBITMQ_HOST}:15672/api/aliveness-test/%2F; do
        echo 'RabbitMQ not ready... retrying in 3s'
        sleep 3
      done
      
      echo 'RabbitMQ is UP! Configuring...'

      # create VHost 
      echo 'Creating VHost: $${RABBITMQ_VHOST}'
      curl -i -u $${RABBITMQ_USER}:$${RABBITMQ_PASS} -H 'content-type:application/json' -X PUT http://$${RABBITMQ_HOST}:15672/api/vhosts/$${RABBITMQ_VHOST}

      # Set Permissions 
      echo 'Setting Permissions for user: $${RABBITMQ_USER}'
      curl -i -u $${RABBITMQ_USER}:$${RABBITMQ_PASS} -H 'content-type:application/json' -X PUT http://$${RABBITMQ_HOST}:15672/api/permissions/$${RABBITMQ_VHOST}/$${RABBITMQ_USER} -d '{\"configure\":\".*\",\"write\":\".*\",\"read\":\".*\"}'
      
      echo 'SETUP COMPLETED SUCCESSFULLY!'
      "

  # POSTGRES EXPORTER (Cho Metrics Database)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: awe-postgres-exporter-dev
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/awe_db?sslmode=disable"
    networks:
      - awe-network
    depends_on:
      postgres:
        condition: service_healthy

